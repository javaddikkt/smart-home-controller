name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: edu-self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          go mod tidy
          go build -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8
          output-format: colored-line-number

      - name: Test
        env:
          CGO_ENABLED: 1
        run: |
          go test -v -race -coverpkg=./... ./...
